[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "jarvis-asistan"
dynamic = ["version"]
description = "JARVIS: Türkçe, sesli, Claude destekli Windows kişisel asistanı"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "PySide6>=6.8,<7",
    "qasync>=0.27",
    "psutil>=6.0",
    "pydantic>=2.7,<3",
    "platformdirs>=4.2",
    "nvidia-ml-py>=12.535",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-qt>=4.4", "fonttools>=4.50"]

[project.gui-scripts]
jarvis = "jarvis.app:main"

[tool.setuptools.dynamic]
version = { attr = "jarvis.__version__" }

[tool.setuptools.packages.find]
include = ["jarvis*"]

[tool.setuptools.package-data]
jarvis = ["assets/fonts/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
qt_api = "pyside6"
