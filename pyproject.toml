[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "jarvis-asistan"
dynamic = ["version"]
description = "JARVIS: Türkçe, sesli, Claude destekli Windows kişisel asistanı"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "PySide6>=6.8,<7",
    "qasync>=0.27",
    "psutil>=6.0",
    "pydantic>=2.7,<3",
    "platformdirs>=4.2",
    "nvidia-ml-py>=12.535",
    "anthropic>=2.6,<3",
    "keyring>=25",
    # Aşama 5: Windows araçları
    "send2trash>=1.8",
    "pypdf>=4.0",
    "python-docx>=1.1",
    "pywin32>=306; sys_platform == 'win32'",
    "comtypes>=1.4; sys_platform == 'win32'",
    "pycaw>=20240316; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-qt>=4.4", "fonttools>=4.50"]

[project.gui-scripts]
jarvis = "jarvis.app:main"

[tool.setuptools.dynamic]
version = { attr = "jarvis.__version__" }

[tool.setuptools.packages.find]
include = ["jarvis*"]

[tool.setuptools.package-data]
jarvis = ["assets/fonts/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
qt_api = "pyside6"
# Canlı (ücretli) API testleri varsayılan olarak çalışmaz: `python -m pytest -m live`
addopts = "-m 'not live'"
markers = [
    "live: gerçek Claude API'sine istek atar (küçük bir ücret doğar)",
    "windows: yalnızca gerçek Windows'ta çalışır (diğer sistemlerde otomatik atlanır)",
]
