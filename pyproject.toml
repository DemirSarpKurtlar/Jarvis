[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "jarvis-asistan"
dynamic = ["version"]
description = "JARVIS: Türkçe, sesli, Claude destekli Windows kişisel asistanı"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "PySide6>=6.8,<7",
    "qasync>=0.27",
    "psutil>=6.0",
    "pydantic>=2.7,<3",
    "platformdirs>=4.2",
    "nvidia-ml-py>=12.535",
    "anthropic>=2.6,<3",
    "keyring>=25",
    # Aşama 3: ses motoru (yerel, ücretsiz)
    "numpy>=2.0,<3",
    "sounddevice>=0.5",
    "onnxruntime>=1.18,<2",
    "faster-whisper>=1.1,<2",
    "huggingface-hub>=0.23",
    "tqdm>=4.60",
    "piper-tts>=1.3,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-qt>=4.4", "fonttools>=4.50"]

[project.gui-scripts]
jarvis = "jarvis.app:main"

[tool.setuptools.dynamic]
version = { attr = "jarvis.__version__" }

[tool.setuptools.packages.find]
include = ["jarvis*"]

[tool.setuptools.package-data]
jarvis = ["assets/fonts/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
qt_api = "pyside6"
# Canlı (ücretli) API testleri varsayılan olarak çalışmaz: `python -m pytest -m live`
addopts = "-m 'not live'"
markers = [
    "live: gerçek Claude API'sine istek atar (küçük bir ücret doğar)",
    "models: gerçek ses modeli dosyası ister; yoksa atlanır (JARVIS_DOWNLOAD_MODELS=1 indirir)",
    "windows: yalnızca Windows'ta çalışır; başka sistemde atlanır",
]
